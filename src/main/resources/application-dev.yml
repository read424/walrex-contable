quarkus:
  application:
    name: admon-catalogo
  http:
    port: 8089
    non-application-root-path: /q
    access-log:
      enabled: true
      pattern: "%{REMOTE_IP} %l %u %t \"%r\" %s %b \"%{i,Referer}\" \"%{i,User-Agent}\" [%D ms]"
      log-to-file: false
  # Deshabilitar Dev Services globalmente y para todas las extensiones
  devservices:
    enabled: false
  test:
    integration-test-profile: test
  vault:
    url: ${VAULT_URL:http://127.0.0.1:8200}
    authentication:
      client-token: ${VAULT_TOKEN:myroot}
    kv-secret-engine-mount-path: secret
    kv-secret-engine-version: 2
    secret-config-kv-path:
      - walrex/infra/database
      - walrex/infra/redis
      - walrex/infra/azure
      - walrex/infra/qdrant
      - walrex/app/openai
      - walrex/app/finnhub
      - walrex/app/groq
      - walrex/app/hugging-face
      - walrex/app/jwt
      - walrex/app/twilio
      - walrex/app/fcm
    # MEDIUM oculta valores en logs; usar LOW solo en dev local
    log-confidentiality-level: MEDIUM
    devservices:
      enabled: false
  hibernate-orm:
    log:
      sql: true
      bind-parameters: true
      format-sql: true
    jdbc:
      statement-fetch-size: 50
      statement-batch-size: 20
  swagger-ui:
    always-include: true
    path: /swagger-ui
  # Deshabilitar Dev Services específicamente para Redis
  redis:
    devservices:
      enabled: false
    hosts: redis://${REDIS_HOST:127.0.0.1}:6379
    timeout: 10s
    max-pool-size: 20
    max-pool-waiting: 24
  cache:
    redis:
      expire-after-write: 30m
      prefix: "wx-admon"
    mcp:
      server:
        name: "RemesasBotServer"
        version: 1.0.0
  # SmallRye Fault Tolerance Metrics
  flyway:
    migrate-at-start: true
    locations: db/migration
    baseline-on-migrate: true
    baseline-version: "0"
    repair-at-start: true
  datasource:
    username: ${db-username:postgres}
    password: ${db-password:12345}
    jdbc:
      url: jdbc:postgresql://${db-host:127.0.0.1}:5432/${db-name:walrex_db_prod}
      min-size: 1
      max-size: 4
    reactive:
      url: postgresql://${db-host:127.0.0.1}:5432/${db-name:walrex_db_prod}
  mailer:
    password: dev-mail-password
  langchain4j:
    openai:
      api-key: dev-openai-key
      groq-chat:
        api-key: dev-groq-key
  rest-client:
    twilio-api:
      auth:
        basic:
          username: dev-twilio-sid
          password: dev-twilio-token

  otel:
    sdk:
      disabled: true   # deshabilitar OTel en dev, no se requiere collector local

  log:
    console:
      json: false      # texto plano en dev, más legible en consola

  smallrye-fault-tolerance:

mp:
  jwt:
    secret: dev-jwt-secret-local-32-chars-min-ok-padding

app:
  registration:
    token:
      secret: dev-registration-secret-local
  twilio:
    account-sid: dev-twilio-sid
    auth-token: dev-twilio-token
    from-number: "+10000000000"
    whatsapp-from: "whatsapp:+10000000000"

google:
  cloud:
    # Ruta al archivo en el servidor (fuera del classpath); la ruta
    # se almacena en Vault (walrex/app/fcm → fcm-credentials-path)
    service-account-location: ${fcm-credentials-path:/etc/walrex/firebase-service-account.json}

azure:
  doc:
    intel:
      key: dev-azure-key

finnhub:
  api-token: dev-finnhub-token